<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>DPO-Aligned Qwen Demo</title>
<style>
:root{--bg:#fff;--fg:#1a1a1a;--card:#f4f5f7;--accent:#4f46e5;--border:#d8dbe0}
@media (prefers-color-scheme:dark){:root{--bg:#14161a;--fg:#eceef1;--card:#1e2127;--border:#343842}}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--fg)}
main{max-width:720px;margin:0 auto;padding:32px 16px}h1{font-size:1.5rem;margin:0 0 4px}p.sub{margin:0 0 20px;opacity:.7}
textarea{width:100%;min-height:90px;padding:12px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--fg);font:inherit;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 18px}
button{padding:10px 18px;border:0;border-radius:8px;background:var(--accent);color:#fff;font:inherit;cursor:pointer}
button.chip{background:var(--card);color:var(--fg);border:1px solid var(--border);font-size:.85rem;padding:6px 10px}
button:disabled{opacity:.5;cursor:wait}
#out{white-space:pre-wrap;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;min-height:60px}
</style></head><body><main>
<h1>DPO-Aligned Qwen2.5-0.5B</h1>
<p class="sub">Fine-tuned with Direct Preference Optimization on UltraFeedback.</p>
<textarea id="prompt" placeholder="Ask something..."></textarea>
<div class="row"><button id="go">Generate</button>
<button class="chip">Why do AI models sometimes hallucinate?</button>
<button class="chip">How can a student protect personal data online?</button></div>
<div id="out">The response will appear here.</div></main>
<script>
const prompt=document.getElementById("prompt"),out=document.getElementById("out"),go=document.getElementById("go");
document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{prompt.value=b.textContent});
go.onclick=async()=>{const text=prompt.value.trim();if(!text)return;go.disabled=true;out.textContent="Generating (the first request can take a minute)...";
try{const r=await fetch("/api/generate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt:text})});
const d=await r.json();out.textContent=r.ok?d.response:"Error: "+(d.error||r.status)}catch(e){out.textContent="Network error: "+e.message}
go.disabled=false};
</script></body></html>
